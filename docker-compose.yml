services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cuentas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuentas}
      POSTGRES_DB: ${POSTGRES_DB:-cuentas}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
